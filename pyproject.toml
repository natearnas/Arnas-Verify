[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arnas-verify"
version = "0.1.0"
description = "Reference implementation for local signed per-application license verification"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Arnas Verify" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["license", "signing", "verification", "rsa", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
arnas-verify = "arnas_verify.cli:main"

[tool.setuptools]
packages = ["arnas_verify"]

[tool.setuptools.package-data]
arnas_verify = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
